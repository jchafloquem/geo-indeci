<div class="fixed bottom-2 left-1/2 -translate-x-1/2 z-50 w-max max-w-[95vw] sm:max-w-[90vw] pointer-events-none">
  <div id="tour-coordinate-info" class="bg-secondary backdrop-blur-md rounded-xl sm:rounded-2xl px-3 sm:px-4 md:px-6 py-1 sm:py-1.5 shadow-xl sm:shadow-2xl shadow-lime-400/30 sm:shadow-lime-400/50 border border-lime-400/20 sm:border-lime-400/30 pointer-events-auto cursor-pointer">
    <div class="flex flex-col sm:flex-row items-center gap-y-1 sm:gap-y-0 sm:gap-x-4 md:gap-x-6 text-xs sm:text-sm md:text-base text-white" style="font-family: 'Arial Narrow', sans-serif;">

      <!-- Grupo 1: DATUM + Coordenadas Geográficas -->
      <div class="flex items-center gap-3 sm:gap-4 md:gap-6">
        <!-- DATUM: oculto en móvil, visible en sm+ -->
        <div class="hidden sm:flex items-center gap-1.5">
          <span class="uppercase tracking-tighter text-white/80">DATUM WGS 84</span>
        </div>
        <div class="hidden sm:block w-px h-4 bg-white/20"></div>

        <div class="flex items-center gap-3 sm:gap-4 md:gap-6">
          <div class="flex items-center gap-1">
            <span class="text-white/60 uppercase">Lat:</span>
            <span class="tabular-nums">{{ lat.toFixed(4) || '---' }}</span>
          </div>
          <div class="flex items-center gap-1">
            <span class="text-white/60 uppercase">Lon:</span>
            <span class="tabular-nums">{{ lon.toFixed(4) || '---' }}</span>
          </div>
        </div>
      </div>

      <!-- Separador vertical: solo en sm+ -->
      <div class="hidden sm:block w-px h-4 bg-white/20"></div>

      <!-- Grupo 2: Información UTM -->
      <div class="flex items-center gap-3 sm:gap-4 md:gap-6">
        <div class="flex items-center gap-1">
          <span class="text-white/60 uppercase">Zona:</span>
          <span class="tabular-nums">{{ zona || '--' }}</span>
        </div>
        <div class="flex items-center gap-1">
          <span class="text-white/60 uppercase">N:</span>
          <span class="tabular-nums">{{ norte.toFixed(4) || '---' }}</span>
        </div>
        <div class="flex items-center gap-1">
          <span class="text-white/60 uppercase">E:</span>
          <span class="tabular-nums">{{ este.toFixed(4) || '---' }}</span>
        </div>
      </div>

    </div>
  </div>
</div>
